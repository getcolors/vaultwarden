name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
  packages: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          bb: latest
      - uses: astral-sh/setup-uv@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: red
      - run: bun test && bun run typecheck
        working-directory: red
      - run: uv run --locked pytest
        working-directory: blue
      - run: ./scripts/parity.sh
      - run: uv run --with ansible-core python ../scripts/ssh-config-probe.py
        working-directory: blue
      - run: bb test
        working-directory: green
      - run: bb golden
        working-directory: green
      - run: ./scripts/launcher.sh
      - run: sh -n container/entrypoint container/bootstrap container/restore-check
  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: container/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/getcolors/vaultwarden:1.0.0
