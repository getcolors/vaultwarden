profile: vaultwarden-example
workdir: .colors
provider-compute: digitalocean
provider-dns: no-infra
provider-smtp: no-infra
provider-backend: s3
compute-prevent-destroy: true
no-infra-smtp-server: smtp.example.com
no-infra-smtp-port: 587
no-infra-smtp-username: resend
vaultwarden-host: vault.example.com
vaultwarden-image: ghcr.io/getcolors/vaultwarden:1.0.0
vaultwarden-owner-email: owner@example.com
vaultwarden-signups-allowed: false
vaultwarden-admin-enabled: false
litestream-r2-bucket: vaultwarden
litestream-r2-endpoint: https://ACCOUNT.r2.cloudflarestorage.com
litestream-r2-region: auto
litestream-r2-prefix: vault.example.com
litestream-retention: 720h
litestream-snapshot-interval: 24h
litestream-restore-check-oncalendar: Sun *-*-* 03:00:00
digitalocean-region: fra1
digitalocean-size: s-2vcpu-4gb
digitalocean-image: ubuntu-24-04-x64
compute-ssh-sources: [192.0.2.0/24]
compute-http-sources: [0.0.0.0/0]
s3-bucket: vaultwarden-state
s3-region: us-east-1
